name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# The workflow only reads the code; the token it gets needs nothing else.
permissions:
  contents: read

# A new push to a pull request makes the run for the old one pointless. Runs on
# main are left alone: each of them says whether that very commit is green.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # The client lives on Windows, where os.replace, paths and the default text
    # encoding behave differently from Linux, so both are tested.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The tests take seconds; a hung step must not hold a runner for six hours.
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.15"
        cache: pip
        cache-dependency-path: requirements-lock.txt

    # Exactly the versions of requirements-lock.txt (see AGENTS.md for how it is
    # made), so a new release upstream cannot turn this workflow red by itself.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-lock.txt
        pip install -e . --no-deps

    - name: Lint with ruff
      run: |
        ruff check .

    # The code is formatted by ruff; a diff that is not says so here instead of
    # in the next pull request that touches the same lines.
    - name: Check the formatting with ruff
      run: |
        ruff format --check .

    # --cov takes its sources and the minimum (fail_under) from pyproject.toml.
    # -W error: any warning (a deprecation, a coroutine that was never awaited, an
    # unclosed resource) fails the run instead of scrolling by.
    - name: Test with pytest
      run: |
        pytest -W error --cov --cov-report=term
