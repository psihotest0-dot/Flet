name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    # The client lives on Windows, where os.replace, paths and the default text
    # encoding behave differently from Linux, so both are tested.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.15"
        cache: pip
        cache-dependency-path: requirements-lock.txt

    # Exactly the versions of requirements-lock.txt (see AGENTS.md for how it is
    # made), so a new release upstream cannot turn this workflow red by itself.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-lock.txt
        pip install -e . --no-deps

    - name: Lint with ruff
      run: |
        ruff check .

    # --cov takes its sources and the minimum (fail_under) from pyproject.toml.
    - name: Test with pytest
      run: |
        pytest -W error::DeprecationWarning --cov --cov-report=term
