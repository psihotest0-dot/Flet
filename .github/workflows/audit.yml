name: Audit

# Known vulnerabilities in the pinned dependencies (requirements-lock.txt). The
# advisory database is read at run time, so the weekly run reports a new advisory
# even when nobody has pushed. A separate workflow on purpose: a finding must not
# turn the CI workflow (lint and tests) red.
on:
  push:
    branches: [main]
  schedule:
    - cron: "37 5 * * 1" # Mondays, 05:37 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: python -m pip install pip-audit
      # --no-deps --disable-pip: the lock file is already complete (uv pip compile
      # --universal), so nothing is resolved or installed, only looked up.
      # No advisory is ignored. If one ever has to be, name it here with the reason
      # and with what will make the exception unnecessary.
      - run: pip-audit -r requirements-lock.txt --no-deps --disable-pip
