[project]
name = "flet-client"
version = "0.1.0"
description = "Flet client for AI agent"
requires-python = ">=3.11"
dependencies = [
    "flet==0.24.0",
    "httpx",
    "httpx-sse",
    "tenacity",
    "pydantic>=2.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "respx"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-asyncio warns when this is unset, and from pytest 9.2 on that warning is
# raised at start-up under `-W error::DeprecationWarning` (CI), so no test runs.
# Flet 0.24 holds pytest at 9.1 (packaging<24); Flet 1.x would not. "function" is
# pytest-asyncio's documented default.
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.hatch.build.targets.wheel]
packages = ["api", "state", "views"]
