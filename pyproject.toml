[project]
name = "flet-client"
version = "0.1.0"
description = "Flet client for AI agent"
requires-python = ">=3.9"
dependencies = [
    "flet==0.24.0",
    "httpx",
    "httpx-sse",
    "tenacity",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "respx"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.hatch.build.targets.wheel]
packages = ["api", "state", "views"]
