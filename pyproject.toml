[project]
name = "flet-client"
version = "0.1.0"
description = "Flet client for AI agent"
requires-python = ">=3.15"
dependencies = [
    "flet[desktop]==1.1.2",
    # Bounds: from the version the code is tested with up to, not including, the
    # next breaking release (for a 0.x package that is the next minor). What is
    # really installed is fixed in requirements-lock.txt.
    "httpx>=0.28,<1",
    "httpx-sse>=0.4,<0.5",
    "tenacity>=9.2,<10",
    "pydantic>=2.14,<3"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "ruff>=0.17,<0.18",
    "respx>=0.23,<0.24"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest-asyncio warns when this is unset, and from pytest 9.2 on that warning is
# raised at start-up under `-W error::DeprecationWarning` (CI), so no test runs.
# "function" is pytest-asyncio's documented default.
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["api", "state", "views", "main"]
branch = true

[tool.coverage.report]
# Measured 89 % (statements and branches) on 2026-11-13; one point of room so
# a small refactor does not turn CI red. Raise it when the number goes up.
fail_under = 88
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py315"

[tool.ruff.lint]
# The default rules (E4, E7, E9, F) plus: import order (I), likely bugs (B),
# outdated syntax (UP), asyncio traps (ASYNC) and eager formatting in
# logging calls (G).
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "ASYNC", "G"]

[tool.hatch.build.targets.wheel]
packages = ["api", "state", "views"]
